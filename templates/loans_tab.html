<!-- Loans Tab Content Container -->
<div id="loans-section" style="padding: 10px 0;">
    
    <!-- Top Action & Summary Banner -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; gap: 15px;">
            <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px 18px; border-radius: 8px;">
                <span style="font-size: 0.8rem; color: #1e40af; font-weight: 600; display: block;">Total Outstanding Loan</span>
                <span id="loanTotalOutstanding" style="font-size: 1.25rem; font-weight: 800; color: #1d4ed8;">₹0.00</span>
            </div>
        </div>
        <button onclick="openLoanModal()" style="background: #2563eb; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-plus"></i> Issue New Loan / Advance
        </button>
    </div>

    <!-- Loans Data Table -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem;">
            <thead style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: #475569; font-weight: 600;">
                <tr>
                    <th style="padding: 12px 16px;">Type</th>
                    <th style="padding: 12px 16px;">Disbursed Date</th>
                    <th style="padding: 12px 16px;">Total Amount</th>
                    <th style="padding: 12px 16px;">Monthly EMI</th>
                    <th style="padding: 12px 16px;">Remaining</th>
                    <th style="padding: 12px 16px;">Status</th>
                </tr>
            </thead>
            <tbody id="loanTableBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 30px; color: #64748b;">
                        No records available for this staff in database.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal: Issue New Loan -->
<div id="loanModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; width: 420px; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h3 style="font-size: 1.1rem; color: #0f172a; margin: 0;">Issue Loan / Salary Advance</h3>
        
        <div>
            <label style="font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Loan Type</label>
            <select id="modalLoanType" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
                <option value="Advance Salary">Advance Salary</option>
                <option value="Personal Loan">Personal Loan</option>
                <option value="Emergency Loan">Emergency Loan</option>
            </select>
        </div>

        <div>
            <label style="font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Loan Amount (₹)</label>
            <input type="number" id="modalLoanAmount" placeholder="e.g. 10000" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
        </div>

        <div>
            <label style="font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Monthly Deduction (₹)</label>
            <input type="number" id="modalLoanEmi" placeholder="e.g. 2000" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
        </div>

        <div>
            <label style="font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Remarks</label>
            <textarea id="modalLoanRemarks" rows="2" placeholder="Optional notes" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
            <button onclick="closeLoanModal()" style="padding: 8px 14px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer;">Cancel</button>
            <button onclick="submitNewLoan()" style="padding: 8px 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Issue Loan</button>
        </div>
    </div>
</div>

<script>
    let currentStaffCode = "EMP001"; // Dynamically passed employee code

    async function loadStaffLoans(empCode) {
        currentStaffCode = empCode || currentStaffCode;
        try {
            const res = await fetch(`/api/hr/employee-loans?emp_code=${currentStaffCode}`);
            const data = await res.json();
            
            if (data.success && data.loans.length > 0) {
                document.getElementById('loanTotalOutstanding').innerText = `₹${data.total_outstanding.toLocaleString('en-IN')}`;
                
                const tbody = document.getElementById('loanTableBody');
                tbody.innerHTML = '';
                
                data.loans.forEach(loan => {
                    const statusColor = loan.status === 'Active' ? 'background: #dcfce7; color: #166534;' : 'background: #f1f5f9; color: #475569;';
                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 12px 16px; font-weight: 600; color: #1e293b;">${loan.loan_type}</td>
                            <td style="padding: 12px 16px; color: #64748b;">${loan.disbursed_date}</td>
                            <td style="padding: 12px 16px; font-weight: 600;">₹${loan.loan_amount.toLocaleString('en-IN')}</td>
                            <td style="padding: 12px 16px; color: #64748b;">₹${loan.monthly_emi.toLocaleString('en-IN')}</td>
                            <td style="padding: 12px 16px; font-weight: 700; color: #dc2626;">₹${loan.remaining_amount.toLocaleString('en-IN')}</td>
                            <td style="padding: 12px 16px;">
                                <span style="font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; ${statusColor}">${loan.status}</span>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) {
            console.error("Load loan error:", err);
        }
    }

    function openLoanModal() { document.getElementById('loanModal').style.display = 'flex'; }
    function closeLoanModal() { document.getElementById('loanModal').style.display = 'none'; }

    async function submitNewLoan() {
        const type = document.getElementById('modalLoanType').value;
        const amount = document.getElementById('modalLoanAmount').value;
        const emi = document.getElementById('modalLoanEmi').value;
        const remarks = document.getElementById('modalLoanRemarks').value;

        if (!amount || amount <= 0) {
            alert('Please enter a valid loan amount');
            return;
        }

        const res = await fetch('/api/hr/issue-loan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                emp_code: currentStaffCode,
                loan_type: type,
                amount: amount,
                monthly_emi: emi || amount,
                remarks: remarks
            })
        });

        const resp = await res.json();
        if (resp.success) {
            closeLoanModal();
            loadStaffLoans(currentStaffCode);
        } else {
            alert(resp.error || 'Failed to issue loan');
        }
    }
</script>
