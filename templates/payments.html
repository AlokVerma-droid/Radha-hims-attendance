<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Payments - Radha HIMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; background: #f8fafc; min-width: 0; }
        .top-header { height: 60px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0; }
        .page-title-header { font-size: 1.25rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .user-name-tag { font-weight: 600; font-size: 0.9rem; color: #334155; }

        .content-body { padding: 24px 32px; flex: 1; overflow-y: auto; max-width: 900px; margin: 0 auto; width: 100%; }
        
        .card-wrapper { background: #ffffff; padding: 30px 35px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); margin-bottom: 24px; }
        .section-title { font-size: 0.95rem; font-weight: 700; color: #1e293b; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-weight: 600; color: #475569; font-size: 0.82rem; }
        .req-star { color: #dc2626; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; background: #fff; color: #1e293b; transition: 0.15s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        .bank-info-chip { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; display: none; margin-bottom: 15px; align-items: center; gap: 10px; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 18px; }
        .btn-submit-pay { background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.15s; }
        .btn-submit-pay:hover { background: #1d4ed8; }

        .table-container { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        .table-container th { background: #f8fafc; padding: 12px 16px; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .table-container td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .btn-payslip { background: #f1f5f9; color: #2563eb; border: 1px solid #cbd5e1; padding: 5px 10px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
        .btn-payslip:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    {% include 'sidebar.html' %}

    <div class="main-wrapper">
        <div class="top-header">
            <div class="page-title-header"><i class="fa-solid fa-indian-rupee-sign" style="color: #2563eb;"></i> Staff Payment & Disbursement</div>
            <div class="user-name-tag">Logged in as: <span id="topUserName">Admin</span></div>
        </div>

        <div class="content-body">
            <div class="card-wrapper">
                <div class="section-title"><i class="fa-solid fa-circle-plus" style="color: #2563eb;"></i> Issue New Staff Payment</div>

                <form id="paymentForm" onsubmit="submitStaffPayment(event)">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Select Staff Member <span class="req-star">*</span></label>
                            <select id="payEmpSelect" required onchange="onStaffSelectChange()">
                                <option value="">-- Loading Staff Members --</option>
                            </select>
                        </div>

                        <!-- Bank Account Quick-View Chip -->
                        <div class="form-group full-width">
                            <div id="bankInfoChip" class="bank-info-chip">
                                <i class="fa-solid fa-university"></i>
                                <span id="bankDetailsText">Account: - | IFSC: - | UPI: -</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Payment Purpose / Description <span class="req-star">*</span></label>
                            <input type="text" id="payType" value="Salary Payout - September 2026" required>
                        </div>

                        <div class="form-group">
                            <label>Amount (₹) <span class="req-star">*</span></label>
                            <input type="number" id="payAmount" step="0.01" placeholder="0.00" required>
                        </div>

                        <div class="form-group">
                            <label>Payment Mode <span class="req-star">*</span></label>
                            <select id="payMode" required>
                                <option value="Direct Bank Transfer" selected>Direct Bank Transfer</option>
                                <option value="UPI Transfer">UPI Transfer</option>
                                <option value="Cash">Cash</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Disbursement Date <span class="req-star">*</span></label>
                            <input type="date" id="payDate" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Transaction Reference / UTR Number</label>
                            <input type="text" id="payRefNo" placeholder="e.g. UTRN123456789">
                        </div>

                        <div class="form-group full-width">
                            <label>Remarks / Notes</label>
                            <textarea id="payRemarks" rows="2" placeholder="e.g. Monthly salary disbursed successfully"></textarea>
                        </div>
                    </div>

                    <div class="action-bar">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="sendNotification" class="custom-chk" checked>
                            <label for="sendNotification" style="font-size: 0.85rem; font-weight: 600; color: #334155; cursor: pointer;">Send WhatsApp/SMS Payment Receipt</label>
                        </div>
                        <button type="submit" class="btn-submit-pay"><i class="fa-solid fa-check"></i> Process & Save Payment</button>
                    </div>
                </form>
            </div>

            <!-- Recent Payments Archive Table -->
            <div class="card-wrapper" style="padding: 20px 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">
                    <div class="section-title" style="margin-bottom: 0; border-bottom: none;"><i class="fa-solid fa-history" style="color: #059669;"></i> Recent Payment History</div>
                    <input type="text" id="historySearchInput" placeholder="Search history..." onkeyup="filterHistoryTable()" style="padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; outline: none; width: 220px;">
                </div>
                <div style="overflow-x: auto;">
                    <table class="table-container">
                        <thead>
                            <tr>
                                <th>Staff Name</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Mode</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentPaymentsTableBody">
                            <tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 15px;">Loading transaction history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/hr';
        let branchStaffList = [];
        let allPayoutHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('payDate').value = new Date().toISOString().split('T')[0];
            const urlParams = new URLSearchParams(window.location.search);
            const prefilledEmp = urlParams.get('emp');
            loadPaymentDropdowns(prefilledEmp);
            loadRecentPayments();
        });

        async function loadPaymentDropdowns(prefilledEmp = '') {
            try {
                const activeBranchId = localStorage.getItem('active_branch_id') || '';
                const res = await fetch(`${API_BASE}/employees${activeBranchId ? '?branch_id=' + activeBranchId : ''}`);
                const data = await res.json();
                branchStaffList = data.employees || data.data || [];

                const select = document.getElementById('payEmpSelect');
                if (select) {
                    select.innerHTML = '<option value="">-- Select Staff Member --</option>';
                    branchStaffList.forEach(emp => {
                        const code = emp.EmployeeCode || emp.emp_code || emp.id || '';
                        const name = emp.FullName || emp.EmpName || emp.emp_name || 'Staff';
                        const salary = emp.Salary || emp.salary || 0;
                        const bankAcc = emp.AccountNo || emp.account_no || 'N/A';
                        const ifsc = emp.IfscCode || emp.ifsc_code || 'N/A';
                        const upi = emp.UpiId || emp.upi_id || 'N/A';

                        const isSelected = String(code) === String(prefilledEmp) ? 'selected' : '';
                        select.innerHTML += `<option value="${code}" data-salary="${salary}" data-bank="${bankAcc}" data-ifsc="${ifsc}" data-upi="${upi}" ${isSelected}>${name} (ID: ${code})</option>`;
                    });
                    if (prefilledEmp) onStaffSelectChange();
                }
            } catch (err) {
                console.error("Error loading staff:", err);
            }
        }

        function onStaffSelectChange() {
            const select = document.getElementById('payEmpSelect');
            const selectedOpt = select.options[select.selectedIndex];
            const salary = selectedOpt.getAttribute('data-salary');
            const bankAcc = selectedOpt.getAttribute('data-bank');
            const ifsc = selectedOpt.getAttribute('data-ifsc');
            const upi = selectedOpt.getAttribute('data-upi');
            
            const chip = document.getElementById('bankInfoChip');
            const chipText = document.getElementById('bankDetailsText');

            if (select.value) {
                if (salary && salary > 0) {
                    document.getElementById('payAmount').value = parseFloat(salary).toFixed(2);
                }
                chipText.innerText = `Account: ${bankAcc} | IFSC: ${ifsc} | UPI ID: ${upi}`;
                chip.style.display = 'flex';
            } else {
                chip.style.display = 'none';
            }
        }

        async function loadRecentPayments() {
            const tbody = document.getElementById('recentPaymentsTableBody');
            try {
                const res = await fetch(`${API_BASE}/employee-loans`);
                const data = await res.json();
                const loans = data.loans || [];
                
                allPayoutHistory = loans.filter(l => l.loan_type && l.loan_type.includes('Salary Payout - '));
                renderHistoryTable(allPayoutHistory);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444; padding: 15px;">Could not load transaction history.</td></tr>`;
            }
        }

        function renderHistoryTable(list) {
            const tbody = document.getElementById('recentPaymentsTableBody');
            tbody.innerHTML = '';
            if (list.length > 0) {
                list.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600;">${item.emp_name || 'Staff Member'}</td>
                            <td>${item.loan_type}</td>
                            <td style="color: #16a34a; font-weight: 600;">₹ ${parseFloat(item.loan_amount).toFixed(2)}</td>
                            <td>${item.payment_mode || 'Direct Bank Transfer'}</td>
                            <td>${item.disbursed_date || '-'}</td>
                            <td><button class="btn-payslip" onclick="downloadPayslip('${item.loan_type}', '${item.loan_amount}')"><i class="fa-solid fa-download"></i> Receipt</button></td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 15px;">No payment history found.</td></tr>`;
            }
        }

        function filterHistoryTable() {
            const q = document.getElementById('historySearchInput').value.toLowerCase();
            const filtered = allPayoutHistory.filter(item => {
                const name = (item.emp_name || '').toLowerCase();
                const type = (item.loan_type || '').toLowerCase();
                return name.includes(q) || type.includes(q);
            });
            renderHistoryTable(filtered);
        }

        function downloadPayslip(period, amount) {
            alert(`Generating receipt for ${period} amounting to ₹ ${parseFloat(amount).toFixed(2)}...`);
        }

        async function submitStaffPayment(e) {
            e.preventDefault();
            const empCode = document.getElementById('payEmpSelect').value;
            const amount = parseFloat(document.getElementById('payAmount').value) || 0;
            const payType = document.getElementById('payType').value;
            const payMode = document.getElementById('payMode').value;
            const payDate = document.getElementById('payDate').value;
            const refNo = document.getElementById('payRefNo').value;
            const remarks = document.getElementById('payRemarks').value;
            const sendAlert = document.getElementById('sendNotification').checked;

            if (!empCode || amount <= 0) {
                alert("Please select a staff member and provide a valid amount!");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/issue-loan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emp_code: empCode,
                        amount: amount,
                        loan_type: payType,
                        payment_mode: payMode,
                        disbursed_date: payDate,
                        remarks: `UTR: ${refNo || 'N/A'} | Note: ${remarks || 'Direct Payment'}`,
                        send_alert: sendAlert
                    })
                });
                const resData = await res.json();
                if (res.ok && resData.success) {
                    alert("Payment successfully processed and saved!");
                    document.getElementById('paymentForm').reset();
                    document.getElementById('payDate').value = new Date().toISOString().split('T')[0];
                    document.getElementById('bankInfoChip').style.display = 'none';
                    loadRecentPayments();
                } else {
                    alert("Failed to process payment: " + (resData.error || "Server error"));
                }
            } catch (err) {
                alert("Network communication error: " + err.message);
            }
        }
    </script>
</body>
</html>
