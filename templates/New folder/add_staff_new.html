<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Complete Staff Member - Radha HIMS</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: #f0f4f8; color: #2d3748; display: flex; height: 100vh; overflow: hidden; }

        /* MAIN CONTENT AREA & WRAPPER (Flex Layout: Adapts automatically with 240px and 68px sidebar) */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; min-width: 0; }
        .top-header { height: 60px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0; }
        .content-container { padding: 35px 25px; display: flex; justify-content: center; align-items: flex-start; flex: 1; overflow-y: auto; }

        /* SHAANDAR PROFESSIONAL CARD WRAPPER */
        .card-wrapper { 
            background: #ffffff; 
            width: 100%; 
            max-width: 860px; 
            padding: 35px 40px; 
            border-radius: 16px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
        }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 18px; margin-bottom: 25px; }
        .page-heading { font-size: 1.35rem; font-weight: 700; color: #1a202c; display: flex; align-items: center; gap: 12px; }
        .back-btn { text-decoration: none; color: #4a5568; background: #edf2f7; padding: 9px 18px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .back-btn:hover { background: #e2e8f0; color: #2d3748; }

        /* SECTION HEADERS */
        .section-title { 
            font-size: 1.02rem; 
            font-weight: 700; 
            color: #2b6cb0; 
            margin: 25px 0 16px 0; 
            border-bottom: 2px solid #ebf8ff; 
            padding-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .form-group.full-width { grid-column: span 2; }
        
        .form-group label { font-weight: 600; color: #4a5568; font-size: 0.88rem; display: flex; align-items: center; gap: 4px; }
        .req-star { color: #e53e3e; font-weight: bold; font-size: 1rem; }

        .form-group input, .form-group select { 
            padding: 11px 15px; 
            border: 1px solid #cbd5e0; 
            border-radius: 9px; 
            outline: none; 
            font-size: 0.93rem; 
            color: #2d3748; 
            background-color: #fff; 
            transition: all 0.2s ease-in-out; 
        }
        .form-group input::placeholder { color: #a0aec0; }
        .form-group input:focus, .form-group select:focus { 
            border-color: #3182ce; 
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15); 
        }

        /* BUTTONS */
        .action-bar { display: flex; justify-content: flex-end; gap: 14px; border-top: 2px solid #edf2f7; padding-top: 22px; margin-top: 30px; }
        .btn-submit { background: #38a169; color: white; border: none; padding: 12px 30px; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(56, 161, 105, 0.2); }
        .btn-submit:hover { background: #2f855a; transform: translateY(-1px); }
        .btn-cancel { padding: 12px 24px; border: 1px solid #cbd5e0; background: white; border-radius: 9px; font-weight: 600; text-decoration: none; color: #4a5568; transition: 0.2s; font-size: 0.92rem; }
        .btn-cancel:hover { background: #f7fafc; color: #2d3748; }
        
        .badge-status { padding: 2px 6px; border-radius: 10px; font-size: 0.65rem; font-weight: bold; background: #c6f6d5; color: #22543d; margin-left: auto; }
    </style>
</head>
<body>

    <!-- 🚀 CENTRALIZED SIDEBAR VIA JINJA2 INCLUDE -->
    {% include 'sidebar.html' %}

    <!-- 2. MAIN WRAPPER -->
    <div class="main-wrapper">
        <div class="top-header">
            <span style="font-weight: 600; color: #2d3748;" id="loggedInUserName">System Admin</span>
            <div id="userAvatarBadge" style="width: 38px; height: 38px; border-radius: 50%; background: #3182ce; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">SA</div>
        </div>

        <div class="content-container">
            <div class="card-wrapper">
                
                <!-- Header Row -->
                <div class="header-row">
                    <div class="page-heading">
                        <i class="fa-solid fa-user-plus" style="color: #3182ce;"></i> Register Staff Profile
                    </div>
                    <a href="/hr" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
                </div>

                <form id="standaloneAddStaffForm">
                    
                    <!-- SECTION 1: Personal Details -->
                    <div class="section-title"><i class="fa-solid fa-id-card"></i> Personal Details</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Staff Full Name <span class="req-star">*</span></label>
                            <input type="text" id="empName" required placeholder="Enter staff full name">
                        </div>
                        <div class="form-group">
                            <label>Mobile Number <span class="req-star">*</span></label>
                            <input type="tel" id="empMobile" required placeholder="Enter 10-digit mobile number">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="empEmail" placeholder="Enter email address (Optional)">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth (DOB) <span class="req-star">*</span></label>
                            <input type="date" id="empDob" required>
                        </div>
                    </div>

                    <!-- SECTION 2: Employment Info -->
                    <div class="section-title"><i class="fa-solid fa-briefcase"></i> Employment Info</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Department <span class="req-star">*</span></label>
                            <select id="deptSelect" required>
                                <option value="">-- Select Department --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Branch</label>
                            <select id="branchSelect">
                                <option value="">-- Select Branch (Optional) --</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>Date of Joining (DOJ) <span class="req-star">*</span></label>
                            <input type="date" id="empDoj" required>
                        </div>
                    </div>

                    <!-- SECTION 3: Salary & Shift Setup -->
                    <div class="section-title"><i class="fa-solid fa-indian-rupee-sign"></i> Salary & Shift Setup</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Gross Salary (₹) <span class="req-star">*</span></label>
                            <input type="number" id="empSalary" step="0.01" required placeholder="Enter gross monthly salary">
                        </div>
                        <div class="form-group">
                            <label>Payroll Type <span class="req-star">*</span></label>
                            <select id="payrollTypeSelect" required>
                                <option value="">-- Select Payroll Type --</option>
                                <option value="Monthly" selected>Monthly</option>
                                <option value="Daily">Daily</option>
                                <option value="Hourly">Hourly</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Assigned Shift <span class="req-star">*</span></label>
                            <select id="shiftSelect" required>
                                <option value="">-- Select Shift --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Geo-Fence Area</label>
                            <select id="geoFenceSelect">
                                <option value="">-- Select Geo Area (Optional) --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-bar">
                        <a href="/hr" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-check"></i> Register Staff Member</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- SCRIPT FOR DYNAMIC DATA LOADING & SUBMIT -->
    <script>
        const API_BASE = `${window.location.origin}/api/hr`;

        document.addEventListener('DOMContentLoaded', () => {
            loadUserHeaderInfo();
            loadDropdowns();
        });

        async function loadUserHeaderInfo() {
            try {
                const userRes = await fetch(`${API_BASE}/current-user`);
                if (userRes.ok) {
                    const userData = await userRes.json();
                    const fullName = userData.name || userData.username || 'System Admin';
                    const userElem = document.getElementById('loggedInUserName');
                    if (userElem) userElem.innerText = fullName;
                    const userInitials = fullName.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() || 'SA';
                    const avatarElem = document.getElementById('userAvatarBadge');
                    if (avatarElem) avatarElem.innerText = userInitials;
                }
            } catch (err) {}
        }

        async function loadDropdowns() {
            try {
                const resDept = await fetch(`${API_BASE}/departments`);
                const dataDept = await resDept.json();
                const deptSelect = document.getElementById('deptSelect');
                if (dataDept.departments && dataDept.departments.length > 0) {
                    deptSelect.innerHTML = '<option value="">-- Select Department --</option>';
                    dataDept.departments.forEach(d => {
                        deptSelect.innerHTML += `<option value="${d.id || d.name}">${d.name}</option>`;
                    });
                }
            } catch (e) { console.error("Dept load error", e); }

            try {
                const resBranches = await fetch(`${API_BASE}/branches`);
                const dataBranches = await resBranches.json();
                const branchSelect = document.getElementById('branchSelect');
                if (dataBranches.branches && dataBranches.branches.length > 0) {
                    branchSelect.innerHTML = '<option value="">-- Select Branch (Optional) --</option>';
                    dataBranches.branches.forEach(b => {
                        branchSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                    });
                }
            } catch (e) { console.error("Branch load error", e); }

            try {
                const resShift = await fetch(`${API_BASE}/shifts`);
                const dataShift = await resShift.json();
                const shiftSelect = document.getElementById('shiftSelect');
                if (dataShift.shifts && dataShift.shifts.length > 0) {
                    shiftSelect.innerHTML = '<option value="">-- Select Shift --</option>';
                    dataShift.shifts.forEach(s => {
                        shiftSelect.innerHTML += `<option value="${s.name}">${s.timing ? s.name + ' (' + s.timing + ')' : s.name}</option>`;
                    });
                }
            } catch (e) { console.error("Shift load error", e); }

            try {
                const resGeo = await fetch(`${API_BASE}/geofences`);
                const dataGeo = await resGeo.json();
                const geoSelect = document.getElementById('geoFenceSelect');
                if (dataGeo.geofences && dataGeo.geofences.length > 0) {
                    geoSelect.innerHTML = '<option value="">-- Select Geo Area (Optional) --</option>';
                    dataGeo.geofences.forEach(g => {
                        geoSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
                    });
                }
            } catch (e) { console.error("GeoFence load error", e); }
        }

        document.getElementById('standaloneAddStaffForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const deptElement = document.getElementById('deptSelect');
            const deptNameText = deptElement.options[deptElement.selectedIndex] ? deptElement.options[deptElement.selectedIndex].text : '';

            const payload = {
                emp_name: document.getElementById('empName').value,
                mobile_no: document.getElementById('empMobile').value,
                email: document.getElementById('empEmail').value,
                dob: document.getElementById('empDob').value,
                doj: document.getElementById('empDoj').value,
                department_id: deptElement.value,
                department_name: deptNameText,
                branch_id: parseInt(document.getElementById('branchSelect').value) || null,
                salary: parseFloat(document.getElementById('empSalary').value) || 0.0,
                payroll_type: document.getElementById('payrollTypeSelect').value,
                shift: document.getElementById('shiftSelect').value,
                geo_fence_id: parseInt(document.getElementById('geoFenceSelect').value) || null
            };

            try {
                const res = await fetch(`${API_BASE}/add-employee`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (res.ok) {
                    alert(`Staff Member Registered Successfully!\nGenerated Code: ${result.generated_code}`);
                    window.location.href = "/hr";
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert("Network Error: Could not save employee data.");
            }
        });
    </script>
</body>
</html>
