<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Staff - Radha HIMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }
        
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #f8fafc; position: relative; }
        .content-body { padding: 32px 40px 100px 40px; max-width: 1200px; width: 100%; margin: 0 auto; overflow-y: auto; height: 100%; }
        
        .page-header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; }
        
        .section-title-box { margin-bottom: 24px; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .page-desc { font-size: 0.95rem; color: #64748b; font-weight: 500; }

        /* Card & Table Layout */
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .search-box-row { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        
        .search-input-wrap { position: relative; max-width: 320px; width: 100%; }
        .search-input-wrap input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .search-input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 14px 20px; font-size: 0.82rem; font-weight: 700; color: #64748b; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.03em; }
        td { padding: 16px 20px; font-size: 0.9rem; color: #1e293b; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f1f5f9; }

        /* Checkbox Styling */
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; border-radius: 4px; border: 1px solid #cbd5e1; }

        /* Bottom Fixed Action Bar */
        .bottom-action-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 16px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .btn-outline { background: white; color: #2563eb; border: 1px solid #cbd5e1; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; color: #0f172a; }
        
        .btn-primary { background: #2563eb; color: white; border: none; padding: 10px 32px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }

    </style>
</head>
<body>

    {% include 'sidebar.html' %}

    <div class="main-wrapper">
        <div class="content-body">
            <div class="page-header-top">
                <!-- 🎯 Sahi HTML Settings Page Route -->
                <a href="/hr/settings" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>

            <div class="section-title-box">
                <h1 class="page-title">Share Staff App</h1>
                <p class="page-desc">We will send them an SMS with invite link</p>
            </div>

            <div class="card">
                <div class="search-box-row">
                    <div class="search-input-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="staffSearchInput" placeholder="Search by name or staff ID" onkeyup="filterStaffTable()">
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;"><input type="checkbox" id="selectAllCheckbox" onchange="toggleAllCheckboxes()"></th>
                            <th>Name</th>
                            <th>Staff ID</th>
                            <th>Phone Number</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #64748b; padding: 24px;">Loading staff records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Fixed Bottom Action Bar -->
        <div class="bottom-action-bar">
            <button class="btn-outline" onclick="window.location.href='/hr/settings'">Cancel</button>
            <button class="btn-primary" onclick="submitInvites()">Confirm</button>
        </div>
    </div>

    <script>
        const HR_API = `${window.location.origin}/api/hr`;
        let allStaffData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchStaffList();
        });

        async function fetchStaffList() {
            try {
                const activeBranchId = localStorage.getItem('active_branch_id') || '1';
                
                const res = await fetch(`${HR_API}/staff_list?branch_id=${activeBranchId}`);
                const data = await res.json();
                
                if (data.success && data.staff) {
                    allStaffData = data.staff;
                    renderTable(allStaffData);
                } else {
                    allStaffData = [];
                    renderTable([]);
                }
            } catch (err) {
                console.error("Error fetching staff:", err);
                document.getElementById('staffTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #dc2626; padding: 24px;">Failed to load staff list.</td></tr>`;
            }
        }

        function renderTable(staffList) {
            const tbody = document.getElementById('staffTableBody');
            if (staffList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 24px;">No staff records found for this branch.</td></tr>`;
                return;
            }

            tbody.innerHTML = staffList.map(s => `
                <tr>
                    <td><input type="checkbox" class="staff-checkbox" value="${s.id || s.EmployeeID}"></td>
                    <td style="color: #2563eb; font-weight: 600;">${s.name || s.EmployeeName}</td>
                    <td>${s.staff_id || s.EmployeeCode || '-'}</td>
                    <td>${s.phone || s.MobileNo || '-'}</td>
                </tr>
            `).join('');

            document.getElementById('selectAllCheckbox').checked = false;
        }

        function filterStaffTable() {
            const query = document.getElementById('staffSearchInput').value.toLowerCase().trim();
            const filtered = allStaffData.filter(s => 
                ((s.name || s.EmployeeName || '').toLowerCase().includes(query)) || 
                ((s.staff_id || s.EmployeeCode || '').toLowerCase().includes(query)) ||
                ((s.phone || s.MobileNo || '').toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function toggleAllCheckboxes() {
            const isChecked = document.getElementById('selectAllCheckbox').checked;
            const checkboxes = document.querySelectorAll('.staff-checkbox');
            checkboxes.forEach(cb => cb.checked = isChecked);
        }

        async function submitInvites() {
            const selectedCheckboxes = document.querySelectorAll('.staff-checkbox:checked');
            if (selectedCheckboxes.length === 0) {
                alert("Please select at least one staff member to send the invite.");
                return;
            }

            const selectedIds = Array.from(selectedCheckboxes).map(cb => cb.value);

            if (!confirm(`Are you sure you want to send invite SMS to ${selectedIds.length} staff member(s)?`)) {
                return;
            }

            try {
                const res = await fetch(`${HR_API}/send_invites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff_ids: selectedIds })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Invites sent successfully!');
                    window.location.href = '/hr/settings';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error('Error sending invites:', err);
                alert('Failed to connect to server.');
            }
        }
    </script>
</body>
</html>
