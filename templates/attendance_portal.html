<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance Portal - Radha HIMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }

        /* MAIN WRAPPER (Flex Layout: Adapts automatically with 240px and 68px sidebar) */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; background: #f8fafc; min-width: 0; }
        .top-header { height: 60px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0; }

        .container { max-width: 1100px; margin: 0 auto; width: 100%; padding: 30px; flex: 1; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-back { padding: 9px 18px; border: 1px solid #cbd5e0; background: #fff; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .staff-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .status-btn { padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
        .badge-status { padding: 2px 6px; border-radius: 10px; font-size: 0.65rem; font-weight: bold; background: #c6f6d5; color: #22543d; margin-left: auto; }
    </style>
</head>
<body>

    <!-- 🚀 CENTRALIZED SIDEBAR VIA JINJA2 INCLUDE -->
    {% include 'sidebar.html' %}

    <!-- 2. MAIN WRAPPER -->
    <div class="main-wrapper">
        <div class="top-header">
            <span style="font-weight: 600; color: #2d3748;" id="loggedInUserName">System Admin</span>
            <div id="userAvatarBadge" style="width: 38px; height: 38px; border-radius: 50%; background: #3182ce; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">SA</div>
        </div>

        <div class="container">
            <div class="top-bar">
                <div>
                    <h1 style="font-size: 1.6rem; font-weight: 700;">Staff Attendance Portal</h1>
                    <small style="color: #64748b;">Daily Live Attendance & Status Tracker</small>
                </div>
                <a href="/hr" class="btn-back">&larr; Back to Dashboard</a>
            </div>

            <div class="metrics-grid">
                <div><span style="font-size: 0.8rem; color: #64748b;">Total Staff</span><h3 id="statTotal">0</h3></div>
                <div><span style="font-size: 0.8rem; color: #64748b;">Present</span><h3 style="color: #16a34a;">0</h3></div>
                <div><span style="font-size: 0.8rem; color: #64748b;">Absent</span><h3 style="color: #dc2626;">0</h3></div>
                <div><span style="font-size: 0.8rem; color: #64748b;">Half Day</span><h3 style="color: #d97706;">0</h3></div>
            </div>

            <div id="staffList">
                <p style="text-align: center;">Loading staff portal...</p>
            </div>
        </div>
    </div>

    <script>
        const HR_API = `${window.location.origin}/api/hr`;

        document.addEventListener('DOMContentLoaded', () => {
            loadUserHeaderInfo();
            loadPortal();
        });

        async function loadUserHeaderInfo() {
            try {
                const userRes = await fetch(`${HR_API}/current-user`);
                if (userRes.ok) {
                    const userData = await userRes.json();
                    const fullName = userData.name || userData.username || 'System Admin';
                    const userElem = document.getElementById('loggedInUserName');
                    if (userElem) userElem.innerText = fullName;
                    const userInitials = fullName.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() || 'SA';
                    const avatarElem = document.getElementById('userAvatarBadge');
                    if (avatarElem) avatarElem.innerText = userInitials;
                }
            } catch (err) {}
        }

        async function loadPortal() {
            try {
                const activeBranchId = localStorage.getItem('active_branch_id');
                const res = await fetch(`${HR_API}/employees`);
                const data = await res.json();
                const container = document.getElementById('staffList');

                let staffList = data.employees || data.data || [];

                // 🎯 Filter by active branch ID
                if (activeBranchId) {
                    staffList = staffList.filter(emp => {
                        const empBranch = emp.Fk_BranchID || emp.branch_id || emp.BranchID || 1;
                        return String(empBranch) === String(activeBranchId);
                    });
                }

                if (staffList.length > 0) {
                    document.getElementById('statTotal').innerText = staffList.length;
                    let html = '';
                    staffList.forEach(emp => {
                        html += `
                        <div class="staff-card">
                            <div>
                                <h3 style="font-size: 1.1rem; color: #0f172a;">${emp.emp_name}</h3>
                                <small style="color: #64748b;">${emp.department} • Code: <b>${emp.emp_code}</b></small>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="markStatus('${emp.emp_code}', 'P')" class="status-btn" style="background:#dcfce7; color:#15803d; border-color:#86efac;">P | Present</button>
                                <button onclick="markStatus('${emp.emp_code}', 'HD')" class="status-btn" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">HD | Half Day</button>
                                <button onclick="markStatus('${emp.emp_code}', 'A')" class="status-btn" style="background:#fee2e2; color:#b91c1c; border-color:#fca5a5;">A | Absent</button>
                            </div>
                        </div>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p style="text-align: center;">No staff records found for this branch.</p>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function markStatus(empCode, status) {
            alert(`Attendance Marked: [${status}] for Emp Code: ${empCode}`);
        }
    </script>
</body>
</html>
